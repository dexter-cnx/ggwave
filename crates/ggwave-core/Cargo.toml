[package]
name = "ggwave-core"
version = "1.2.0"
edition = "2021"
rust-version = "1.77"
description = "Platform-neutral ggwave codec, protocol tuning, ultrasonic helpers, and packet deduplication."
license = "MIT"
repository = "https://github.com/dexter-cnx/ggwave"
homepage = "https://github.com/dexter-cnx/ggwave"
documentation = "https://docs.rs/ggwave-core"
readme = "README.md"
keywords = ["ggwave", "audio", "ultrasonic", "modem", "codec"]
categories = ["multimedia::audio", "encoding"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[features]
default = ["ultrasonic", "dedup"]
ultrasonic = []
dedup = []

[dependencies]
ggwave-rs = "0.1.1"
thiserror = "1.0"

[lints.rust]
unsafe_code = "allow"
