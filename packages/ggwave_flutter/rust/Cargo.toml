[package]
name = "ggwave_flutter_native"
version = "1.2.0"
edition = "2021"
publish = false

[lib]
name = "ggwave_flutter_native"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.8.0"
ggwave-core = "1.2.0"
anyhow = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
cpal = "0.15"
tokio = { version = "1", features = ["rt", "sync"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
