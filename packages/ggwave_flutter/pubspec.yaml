name: ggwave_rs_flutter
description: Cross-platform Flutter microphone/speaker integration for ggwave with Rust acceleration and ultrasonic tuning.
version: 1.2.0
repository: https://github.com/dexter-cnx/ggwave
homepage: https://github.com/dexter-cnx/ggwave
issue_tracker: https://github.com/dexter-cnx/ggwave/issues
topics: [ggwave, audio, ultrasonic, ffi]
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.8.0
  ggwave_dart: ^1.2.0
  code_assets: ^1.2.1
  hooks: ^2.1.0
  native_toolchain_rust: ^1.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.dextercnx.ggwave
        pluginClass: GgwaveRsFlutterPlugin
