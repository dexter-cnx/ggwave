name: Flutter Android

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/ggwave-core/**'
      - 'packages/ggwave_dart/**'
      - 'packages/ggwave_flutter/**'
      - 'tool/bootstrap_flutter_native.sh'
      - 'tool/prepare_flutter_android_validation.sh'
      - 'tool/check_flutter_scaffold.sh'
      - '.github/workflows/flutter-android.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/ggwave-core/**'
      - 'packages/ggwave_dart/**'
      - 'packages/ggwave_flutter/**'
      - 'tool/bootstrap_flutter_native.sh'
      - 'tool/prepare_flutter_android_validation.sh'
      - 'tool/check_flutter_scaffold.sh'
      - '.github/workflows/flutter-android.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'

      - name: Install Linux host audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rustfmt,clippy

      - name: Install FRB codegen 2.8.0
        run: cargo install flutter_rust_bridge_codegen --version 2.8.0 --locked

      - name: Resolve Dart and Flutter dependencies
        run: |
          (cd packages/ggwave_dart && dart pub get)
          (cd packages/ggwave_flutter && flutter pub get)
          (cd packages/ggwave_flutter/example && flutter pub get)

      - name: Generate FRB and native scaffold
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: bash tool/bootstrap_flutter_native.sh

      - name: Commit generated FRB Dart bindings
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ggwave_flutter/lib/src/rust
          if ! git diff --cached --quiet; then
            git commit -m 'build(frb): check in generated Dart bindings'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Analyze and test Dart package
        run: |
          cd packages/ggwave_dart
          dart format --output=none --set-exit-if-changed .
          dart analyze
          dart test

      - name: Analyze and test Flutter package
        run: |
          cd packages/ggwave_flutter
          dart format --output=none --set-exit-if-changed lib test
          (cd example && dart format --output=none --set-exit-if-changed lib)
          flutter analyze
          flutter test

      - name: Build Android example APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          cd packages/ggwave_flutter/example
          original_pubspec="$(mktemp)"
          original_main="$(mktemp)"
          cp pubspec.yaml "$original_pubspec"
          cp lib/main.dart "$original_main"
          flutter create --platforms=android --project-name ggwave_rs_flutter_example .
          cp "$original_pubspec" pubspec.yaml
          cp "$original_main" lib/main.dart
          rm -f "$original_pubspec" "$original_main"
          flutter pub get
          flutter build apk --debug

      - name: Upload Flutter Android example APK
        uses: actions/upload-artifact@v4
        with:
          name: ggwave-rs-flutter-android-example
          path: packages/ggwave_flutter/example/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
