name: Flutter Android

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/ggwave-core/**'
      - 'packages/ggwave_dart/**'
      - 'packages/ggwave_flutter/**'
      - 'tool/bootstrap_flutter_native.sh'
      - 'tool/check_flutter_scaffold.sh'
      - '.github/workflows/flutter-android.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/ggwave-core/**'
      - 'packages/ggwave_dart/**'
      - 'packages/ggwave_flutter/**'
      - 'tool/bootstrap_flutter_native.sh'
      - 'tool/check_flutter_scaffold.sh'
      - '.github/workflows/flutter-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rustfmt,clippy

      - name: Install FRB codegen 2.8.0
        run: dart pub global activate flutter_rust_bridge_codegen 2.8.0

      - name: Resolve Dart and Flutter dependencies
        run: |
          dart pub get --directory packages/ggwave_dart
          flutter pub get --directory packages/ggwave_flutter
          flutter pub get --directory packages/ggwave_flutter/example

      - name: Generate FRB and Android native scaffold
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          cd packages/ggwave_flutter
          flutter_rust_bridge_codegen integrate --integration-backend cargokit --platforms android
          flutter_rust_bridge_codegen generate

      - name: Analyze and test Dart package
        run: |
          dart format --output=none --set-exit-if-changed packages/ggwave_dart
          dart analyze packages/ggwave_dart
          dart test packages/ggwave_dart

      - name: Analyze and test Flutter package
        run: |
          dart format --output=none --set-exit-if-changed packages/ggwave_flutter/lib packages/ggwave_flutter/test packages/ggwave_flutter/example/lib
          flutter analyze packages/ggwave_flutter
          flutter test packages/ggwave_flutter

      - name: Build Android example APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: flutter build apk --debug --target packages/ggwave_flutter/example/lib/main.dart --project-dir packages/ggwave_flutter/example

      - name: Upload Flutter Android example APK
        uses: actions/upload-artifact@v4
        with:
          name: ggwave-rs-flutter-android-example
          path: packages/ggwave_flutter/example/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
