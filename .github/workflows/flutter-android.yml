name: Flutter Android

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/ggwave-core/**'
      - 'packages/ggwave_dart/**'
      - 'packages/ggwave_flutter/**'
      - 'tool/bootstrap_flutter_native.sh'
      - 'tool/check_flutter_scaffold.sh'
      - '.github/workflows/flutter-android.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/ggwave-core/**'
      - 'packages/ggwave_dart/**'
      - 'packages/ggwave_flutter/**'
      - 'tool/bootstrap_flutter_native.sh'
      - 'tool/check_flutter_scaffold.sh'
      - '.github/workflows/flutter-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'

      - name: Install Linux host audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rustfmt,clippy

      - name: Install FRB codegen 2.8.0
        run: cargo install flutter_rust_bridge_codegen --version 2.8.0 --locked

      - name: Resolve Dart and Flutter dependencies
        run: |
          (cd packages/ggwave_dart && dart pub get)
          (cd packages/ggwave_flutter && flutter pub get)
          (cd packages/ggwave_flutter/example && flutter pub get)

      - name: Generate FRB and native scaffold
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          cd packages/ggwave_flutter
          original_pubspec="$(mktemp)"
          original_barrel="$(mktemp)"
          cp pubspec.yaml "$original_pubspec"
          cp lib/ggwave_rs_flutter.dart "$original_barrel"
          restore_package_files() {
            cp "$original_pubspec" pubspec.yaml
            cp "$original_barrel" lib/ggwave_rs_flutter.dart
            rm -f "$original_pubspec" "$original_barrel"
          }
          trap restore_package_files EXIT
          flutter_rust_bridge_codegen integrate --template plugin --no-enable-integration-test

          # FRB 2.8 overlays its default demo/integration-test files and mutates
          # the package barrel even for an existing custom plugin. They are not
          # part of ggwave_rs_flutter and reference template-only APIs, so remove
          # them and restore the package-owned manifest/barrel before generation.
          rm -f rust/src/api/simple.rs
          rm -f lib/src/rust/api/simple.dart
          rm -rf test_driver integration_test

          restore_package_files
          trap - EXIT
          flutter pub get
          flutter_rust_bridge_codegen generate

      - name: Analyze and test Dart package
        run: |
          cd packages/ggwave_dart
          dart format --output=none --set-exit-if-changed .
          dart analyze
          dart test

      - name: Analyze and test Flutter package
        run: |
          cd packages/ggwave_flutter
          dart format --output=none --set-exit-if-changed lib test
          (cd example && dart format --output=none --set-exit-if-changed lib)
          flutter analyze
          flutter test

      - name: Build Android example APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          cd packages/ggwave_flutter/example
          flutter build apk --debug

      - name: Upload Flutter Android example APK
        uses: actions/upload-artifact@v4
        with:
          name: ggwave-rs-flutter-android-example
          path: packages/ggwave_flutter/example/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
